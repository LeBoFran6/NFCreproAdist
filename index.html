<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080a0f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Redirection…</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23080a0f'/%3E%3Cg fill='none' stroke='%238ab4ff' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M20 24a18 18 0 0 1 0 16'/%3E%3Cpath d='M29 18a28 28 0 0 1 0 28'/%3E%3Cpath d='M38 12a38 38 0 0 1 0 40'/%3E%3C/g%3E%3C/svg%3E">
  <noscript><style>#loading { display: none !important; }</style></noscript>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0f;
      --text: #eef2f8;
      --muted: #98a3b6;
      --faint: #6d778a;
      --accent: #8ab4ff;
      --accent-strong: #b7cdff;
      --line: rgba(255, 255, 255, 0.09);
      --danger: #ff9b9b;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(90% 60% at 50% 0%, rgba(66, 101, 184, 0.20), transparent 65%),
        radial-gradient(70% 45% at 50% 100%, rgba(42, 62, 112, 0.12), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .shell { width: min(100%, 400px); }
    .view { width: 100%; }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      text-align: center;
    }

    .spinner {
      width: 26px;
      height: 26px;
      margin-bottom: 20px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
      letter-spacing: 0.01em;
    }

    .hint {
      max-width: 290px;
      margin: 10px 0 0;
      color: var(--faint);
      font-size: 12.5px;
      line-height: 1.5;
    }

    .manual {
      margin-top: 18px;
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(138, 180, 255, 0.35);
      color: var(--accent);
      font-size: 13.5px;
      text-decoration: none;
    }

    .manual:hover { color: var(--accent-strong); }

    .preview {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.018));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      animation: rise 0.22s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border: 1px solid rgba(138, 180, 255, 0.20);
      border-radius: 999px;
      background: rgba(138, 180, 255, 0.09);
      color: var(--accent);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .exit {
      color: var(--faint);
      font-size: 12.5px;
      text-decoration: none;
    }

    .exit:hover { color: var(--muted); }

    h1 {
      margin: 20px 0 10px;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .url {
      display: block;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.5;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .url:hover { border-color: rgba(138, 180, 255, 0.30); }

    .error {
      margin: 10px 0 0;
      color: var(--danger);
      font-size: 12.5px;
      line-height: 1.5;
    }

    .meta {
      display: grid;
      gap: 9px;
      margin: 18px 0 0;
    }

    .meta > div {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 9px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.055);
      font-size: 12.5px;
    }

    .meta > div:last-child { padding-bottom: 0; border-bottom: 0; }
    dt { color: var(--faint); }
    dd { margin: 0; color: var(--muted); text-align: right; }

    .actions {
      display: flex;
      gap: 9px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 10px 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--accent);
      color: #07101f;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .btn:hover { background: var(--accent-strong); }

    .btn.ghost {
      background: transparent;
      border-color: var(--line);
      color: var(--text);
    }

    .btn.ghost:hover { background: rgba(255, 255, 255, 0.04); }

    .btn[aria-disabled="true"] {
      opacity: 0.45;
      pointer-events: none;
    }

    .note {
      margin: 18px 0 0;
      color: var(--faint);
      font-size: 11.5px;
      line-height: 1.6;
    }

    .note code {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .noscript {
      position: fixed;
      right: 20px;
      bottom: 20px;
      left: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .noscript a { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: var(--accent); }
      .preview { animation: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="loading" class="view loading" aria-label="Redirection">
      <div class="spinner" aria-hidden="true"></div>
      <p id="status" class="status" role="status" aria-live="polite">Redirection…</p>
      <p id="hint" class="hint" hidden></p>
      <a id="manual" class="manual" href="#" hidden>Ouvrir le lien</a>
    </section>

    <section id="preview" class="view preview" hidden>
      <div class="preview-head">
        <span class="badge">Aperçu</span>
        <a class="exit" href="./">Quitter</a>
      </div>
      <h1>Destination</h1>
      <a id="preview-url" class="url" href="#" target="_blank" rel="noopener noreferrer">—</a>
      <p id="preview-error" class="error" hidden></p>
      <dl class="meta">
        <div><dt>Redirection</dt><dd id="preview-enabled">—</dd></div>
        <div><dt>Paramètres du scan</dt><dd id="preview-forward">—</dd></div>
        <div><dt>Mise à jour</dt><dd id="preview-updated">—</dd></div>
      </dl>
      <div class="actions">
        <a id="preview-open" class="btn" href="#" target="_blank" rel="noopener noreferrer">Tester le lien</a>
        <button id="preview-copy" class="btn ghost" type="button">Copier</button>
      </div>
      <p class="note">Cette page n'apparaît qu'avec <code>?preview=1</code>. Un scan normal redirige directement.</p>
    </section>
  </main>

  <noscript>
    <!-- Pense à mettre à jour ce lien en même temps que FALLBACK_URL. -->
    <div class="noscript">
      <p>JavaScript est nécessaire pour lire la destination.</p>
      <a href="https://example.com" rel="noopener noreferrer">Ouvrir le lien de secours</a>
    </div>
  </noscript>

  <script>
    (() => {
      "use strict";

      // Filet de sécurité : utilisé uniquement si config.json est illisible.
      // Pense à le mettre à jour en même temps que config.json (facultatif).
      const FALLBACK_URL = "https://example.com";
      const CONFIG_PATH = "./config.json";
      const FETCH_TIMEOUT_MS = 1500;
      const MANUAL_DELAY_MS = 1400;

      const $ = (id) => document.getElementById(id);
      const loading = $("loading");
      const preview = $("preview");
      const status = $("status");
      const hint = $("hint");
      const manual = $("manual");
      const spinner = document.querySelector(".spinner");
      const params = new URLSearchParams(window.location.search);
      const isPreview = params.has("preview");

      function setStatus(text) {
        if (status) status.textContent = text;
      }

      function setHint(text) {
        if (!hint) return;
        hint.textContent = text;
        hint.hidden = !text;
      }

      function stopSpinner() {
        if (spinner) spinner.hidden = true;
      }

      function canonicalPath(pathname) {
        let path = pathname.replace(/\/index\.html$/i, "/");
        if (!path.endsWith("/")) path += "/";
        return path;
      }

      function normalizeUrl(raw) {
        if (typeof raw !== "string" || !raw.trim()) return null;

        let url;
        try {
          url = new URL(raw.trim(), window.location.href);
        } catch {
          return null;
        }

        if (url.protocol !== "https:" && url.protocol !== "http:") return null;
        if (url.username || url.password) return null;

        // Empêche une boucle si la config pointe vers cette page
        // (y compris avec ou sans « index.html » / slash final).
        if (url.origin === window.location.origin && canonicalPath(url.pathname) === canonicalPath(window.location.pathname)) {
          return null;
        }

        return url;
      }

      function withIncomingParams(target) {
        if (!target) return null;

        const copy = new URL(target.href);
        const incoming = new URLSearchParams(window.location.search);
        incoming.delete("preview");

        for (const [key, value] of incoming) {
          copy.searchParams.append(key, value);
        }

        if (window.location.hash && !copy.hash) {
          copy.hash = window.location.hash;
        }

        return copy;
      }

      async function readConfig() {
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

        try {
          const response = await fetch(`${CONFIG_PATH}?v=${Date.now()}`, {
            cache: "no-store",
            signal: controller.signal,
            headers: { Accept: "application/json" }
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const text = (await response.text()).replace(/^\uFEFF/, "");
          const data = JSON.parse(text);

          if (!data || typeof data !== "object" || Array.isArray(data)) {
            throw new Error("Format de config.json invalide");
          }

          return data;
        } finally {
          window.clearTimeout(timer);
        }
      }

      function formatDate(value) {
        if (typeof value !== "string" || !value.trim()) return "—";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString("fr-FR", {
          dateStyle: "medium",
          timeStyle: "short"
        });
      }

      function renderPreview(config, targetUrl, error) {
        document.title = "Aperçu — Redirection NFC";
        loading.hidden = true;
        preview.hidden = false;

        const urlEl = $("preview-url");
        const openEl = $("preview-open");
        const errorEl = $("preview-error");
        const enabledEl = $("preview-enabled");
        const forwardEl = $("preview-forward");
        const updatedEl = $("preview-updated");

        if (targetUrl) {
          urlEl.href = targetUrl;
          urlEl.textContent = targetUrl;
          openEl.href = targetUrl;
          openEl.removeAttribute("aria-disabled");
        } else {
          urlEl.removeAttribute("href");
          urlEl.textContent = "Aucune destination valide";
          openEl.removeAttribute("href");
          openEl.setAttribute("aria-disabled", "true");
        }

        if (error) {
          errorEl.textContent = error;
          errorEl.hidden = false;
        } else {
          errorEl.hidden = true;
        }

        if (config) {
          enabledEl.textContent = config.enabled === false ? "non" : "oui";
          forwardEl.textContent = config.forwardQuery === true ? "transmis" : "non transmis";
          updatedEl.textContent = formatDate(config.updatedAt);
        } else {
          enabledEl.textContent = "—";
          forwardEl.textContent = "—";
          updatedEl.textContent = "—";
        }
      }

      async function showPreview() {
        let config = null;
        let error = null;

        try {
          config = await readConfig();
        } catch (err) {
          console.warn("[NFC] config.json illisible.", err);
          error = "config.json n'a pas pu être lu — le lien de secours est affiché.";
        }

        const configured = config ? normalizeUrl(config.url) : null;
        if (config && !configured) {
          error = "L'URL de config.json est invalide — le lien de secours est affiché.";
        }

        const fallback = normalizeUrl(FALLBACK_URL);
        const base = configured || fallback;
        const target = base ? withIncomingParams(base) : null;
        renderPreview(config, target ? target.href : "", error);
      }

      async function redirect() {
        let config = null;

        try {
          config = await readConfig();
        } catch (err) {
          console.warn("[NFC] config.json illisible, lien de secours utilisé.", err);
        }

        if (config && config.enabled === false) {
          stopSpinner();
          setStatus("Redirection momentanément désactivée.");
          setHint("Le propriétaire de cette puce n'a pas activé le lien.");
          return;
        }

        const configured = config ? normalizeUrl(config.url) : null;
        if (config && !configured) {
          console.warn("[NFC] URL invalide dans config.json, lien de secours utilisé.");
        }

        const fallback = normalizeUrl(FALLBACK_URL);
        const base = configured || fallback;

        if (!base) {
          stopSpinner();
          setStatus("Destination indisponible.");
          setHint("Vérifie le champ « url » de config.json.");
          return;
        }

        const target = config && config.forwardQuery === true ? withIncomingParams(base) : base;
        if (!target) {
          stopSpinner();
          setStatus("Destination indisponible.");
          return;
        }

        manual.href = target.href;
        manual.textContent = "Ouvrir le lien";

        try {
          window.location.replace(target.href);
        } catch (err) {
          console.warn("[NFC] Redirection automatique impossible.", err);
        }

        window.setTimeout(() => {
          manual.hidden = false;
          setStatus("La redirection n'a pas démarré.");
          setHint("Touche le lien ci-dessous pour continuer.");
        }, MANUAL_DELAY_MS);
      }

      function setupCopyButton() {
        const copy = $("preview-copy");
        const urlEl = $("preview-url");
        if (!copy || !urlEl) return;

        copy.addEventListener("click", async () => {
          const value = urlEl.href;
          if (!value) return;

          const original = copy.textContent;
          try {
            await navigator.clipboard.writeText(value);
            copy.textContent = "Copié";
          } catch {
            copy.textContent = "Copie impossible";
          }

          window.setTimeout(() => {
            copy.textContent = original;
          }, 1600);
        });
      }

      setupCopyButton();

      if (isPreview) {
        showPreview();
      } else {
        redirect();
      }
    })();
  </script>
</body>
</html>
